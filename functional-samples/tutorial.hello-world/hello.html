<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Tools</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #f5f1e8;
        color: #24231f;
      }

      body { width: 330px; margin: 0; background: #f5f1e8; }
      main { padding: 20px; }
      header { margin-bottom: 18px; }
      .eyebrow { margin: 0 0 5px; color: #b4522d; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
      h1 { margin: 0; font-family: Georgia, serif; font-size: 28px; font-weight: 500; letter-spacing: 0; }
      .hint { margin: 7px 0 0; color: #6c675c; font-size: 12px; line-height: 1.4; }
      .view[hidden] { display: none; }
      .menu-list { display: grid; gap: 9px; }
      .menu-item { width: 100%; min-height: 64px; padding: 12px 14px; border: 1px solid #cfc7b8; background: #fffdf8; color: #24231f; text-align: left; }
      .menu-item:not(:disabled):hover { border-color: #b4522d; background: #fff9ef; }
      .menu-item strong, .menu-item span { display: block; }
      .menu-item strong { margin-bottom: 4px; font-family: Georgia, serif; font-size: 16px; font-weight: 600; }
      .menu-item span { color: #6c675c; font-size: 11px; font-weight: 400; line-height: 1.35; }
      .menu-item:disabled { cursor: default; opacity: .55; }
      .tool-header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
      .back { min-width: 37px; border: 1px solid #cfc7b8; background: transparent; color: #514b40; font-size: 18px; }
      .back:hover { background: #e9e1d4; }
      .tool-header h2 { margin: 0; font-family: Georgia, serif; font-size: 21px; font-weight: 600; }
      label { display: block; margin: 0 0 7px; color: #4f4a40; font-size: 12px; font-weight: 700; }
      textarea, select { box-sizing: border-box; width: 100%; border: 1px solid #cfc7b8; border-radius: 6px; background: #fffdf8; color: #24231f; font: inherit; }
      textarea { min-height: 112px; padding: 11px; resize: vertical; font-family: Consolas, monospace; font-size: 12px; line-height: 1.5; }
      textarea:focus, select:focus { outline: 2px solid #d98b59; outline-offset: 1px; }
      .field { margin-bottom: 15px; }
      select { height: 36px; padding: 0 9px; }
      .actions { display: flex; gap: 8px; }
      button { min-height: 37px; border: 0; border-radius: 6px; cursor: pointer; font: 700 12px inherit; }
      #search { flex: 1; background: #b4522d; color: #fffaf2; }
      #search:hover { background: #963e20; }
      #check-rows { flex: 1; background: #34704e; color: #fffaf2; }
      #check-rows:hover { background: #28583e; }
      #clear { width: 82px; border: 1px solid #cfc7b8; background: transparent; color: #514b40; }
      #clear:hover { background: #e9e1d4; }
      button:disabled { cursor: wait; opacity: .6; }
      #status { min-height: 17px; margin: 13px 0 0; color: #6c675c; font-size: 11px; line-height: 1.5; }
      #status.error { color: #a33d2d; }
      #status.success { color: #34704e; }
    </style>
  </head>
  <body>
    <main id="home-view" class="view">
      <header>
        <p class="eyebrow">Chrome extension</p>
        <h1>Page tools</h1>
        <p class="hint">Choose a tool to use on the page currently open in Chrome.</p>
      </header>
      <div class="menu-list">
        <button class="menu-item" id="open-bulk-search" type="button">
          <strong>Bulk Search Highlighter</strong>
          <span>Search multiple terms and highlight every result.</span>
        </button>
        <button class="menu-item" type="button" disabled>
          <strong>Page Notes</strong>
          <span>Coming soon</span>
        </button>
        <button class="menu-item" type="button" disabled>
          <strong>Link Collector</strong>
          <span>Coming soon</span>
        </button>
      </div>
    </main>

    <main id="bulk-search-view" class="view" hidden>
      <div class="tool-header">
        <button class="back" id="back-home" type="button" aria-label="Back to home">&#8592;</button>
        <h2>Bulk Search Highlighter</h2>
      </div>
      <div class="field">
        <label for="terms">Search array</label>
        <textarea id="terms" placeholder="alpha&#10;beta&#10;gamma" autofocus></textarea>
      </div>
      <div class="field">
        <label for="separator">Separator</label>
        <select id="separator">
          <option value="newline">Enter (new line)</option>
          <option value="-">Hyphen (-)</option>
          <option value=";">Semicolon (;)</option>
          <option value=",">Comma (,)</option>
        </select>
      </div>
      <div class="actions">
        <button id="search" type="button">Search page</button>
        <button id="check-rows" type="button">Check same row</button>
        <button id="clear" type="button">Clear</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="home.js"></script>
  </body>
</html>
