<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Search</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #f5f1e8;
        color: #24231f;
      }

      body { width: 330px; margin: 0; background: #f5f1e8; }
      main { padding: 20px; }
      header { margin-bottom: 18px; }
      .eyebrow { margin: 0 0 5px; color: #b4522d; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
      h1 { margin: 0; font-family: Georgia, serif; font-size: 28px; font-weight: 500; letter-spacing: 0; }
      .hint { margin: 7px 0 0; color: #6c675c; font-size: 12px; line-height: 1.4; }
      label { display: block; margin: 0 0 7px; color: #4f4a40; font-size: 12px; font-weight: 700; }
      textarea, select { box-sizing: border-box; width: 100%; border: 1px solid #cfc7b8; border-radius: 6px; background: #fffdf8; color: #24231f; font: inherit; }
      textarea { min-height: 112px; padding: 11px; resize: vertical; font-family: Consolas, monospace; font-size: 12px; line-height: 1.5; }
      textarea:focus, select:focus { outline: 2px solid #d98b59; outline-offset: 1px; }
      .field { margin-bottom: 15px; }
      select { height: 36px; padding: 0 9px; }
      .actions { display: flex; gap: 8px; }
      button { min-height: 37px; border: 0; border-radius: 6px; cursor: pointer; font: 700 12px inherit; }
      #search { flex: 1; background: #b4522d; color: #fffaf2; }
      #search:hover { background: #963e20; }
      #clear { width: 82px; border: 1px solid #cfc7b8; background: transparent; color: #514b40; }
      #clear:hover { background: #e9e1d4; }
      button:disabled { cursor: wait; opacity: .6; }
      #status { min-height: 17px; margin: 13px 0 0; color: #6c675c; font-size: 11px; line-height: 1.5; }
      #status.error { color: #a33d2d; }
      #status.success { color: #34704e; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Page tool</p>
        <h1>Bulk search</h1>
        <p class="hint">Find several terms at once and mark every result on the open page.</p>
      </header>
      <div class="field">
        <label for="terms">Search array</label>
        <textarea id="terms" placeholder="alpha&#10;beta&#10;gamma" autofocus></textarea>
      </div>
      <div class="field">
        <label for="separator">Separator</label>
        <select id="separator">
          <option value="newline">Enter (new line)</option>
          <option value="-">Hyphen (-)</option>
          <option value=";">Semicolon (;)</option>
          <option value=",">Comma (,)</option>
        </select>
      </div>
      <div class="actions">
        <button id="search" type="button">Search page</button>
        <button id="clear" type="button">Clear</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
